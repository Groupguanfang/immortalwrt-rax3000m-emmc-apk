name: Build ImmortalWrt RAX3000M eMMC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "configs/**"
      - "files/**"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget curl llvm libelf-dev \
            device-tree-compiler libgmp3-dev libmpc-dev jq zstd

      - name: Fetch ImmortalWrt 25.12.2
        run: |
          git clone --depth 1 --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Add UA3F and OpenClash packages
        run: |
          git clone --depth 1 --branch v3.7.0 \
            https://github.com/SunBK201/UA3F.git ua3f
          test "$(git -C ua3f rev-parse HEAD)" = \
            e464514ab313e3afe308881d7e5732a5baf41ce2
          mkdir -p immortalwrt/package/ua3f
          cp -a ua3f/. immortalwrt/package/ua3f/
          cp -a ua3f/openwrt/. immortalwrt/package/ua3f/
          sed -i \
            's#$(CP) ../go.mod ../go.sum ../main.go ../cmd ../internal#$(CP) ./go.mod ./go.sum ./main.go ./cmd ./internal#' \
            immortalwrt/package/ua3f/Makefile

          git clone --depth 1 --branch v0.48.002 \
            https://github.com/vernesong/OpenClash.git openclash
          test "$(git -C openclash rev-parse HEAD)" = \
            e553e82e01c697aefbe1555261a503f425e00ccd
          cp -a openclash/luci-app-openclash \
            immortalwrt/package/luci-app-openclash

      - name: Add legacy eMMC layout support
        working-directory: immortalwrt
        run: |
          patch -p1 < ../patches/0001-rax3000m-emmc-legacy-layout.patch
          install -Dm0755 ../files/99-rax3000m-emmc-network \
            target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-rax3000m-emmc-network
          cp ../configs/rax3000m-emmc.config .config

      - name: Install feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -E \
            'CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y|CONFIG_PACKAGE_(apk.*|ua3f|luci-app-openclash)=y|CONFIG_KERNEL_DEBUG_INFO_BTF=y' \
            .config
          test "$(grep -c '^CONFIG_PACKAGE_ua3f=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_PACKAGE_luci-app-openclash=y$' .config)" -eq 1
          test "$(grep -c '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' .config)" -eq 1

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify image
        working-directory: immortalwrt
        run: |
          dtb="$(find build_dir/target-*/linux-mediatek_filogic \
            -name 'image-mt7981b-cmcc-rax3000m-emmc.dtb' -print -quit)"
          test -n "$dtb"
          dtc -q -I dtb -O dts "$dtb" > /tmp/rax3000m-emmc.dts
          ! grep -q 'bootargs-override' /tmp/rax3000m-emmc.dts
          grep -q 'bootargs = "root=PARTLABEL=rootfs rootwait"' \
            /tmp/rax3000m-emmc.dts
          image="$(find bin/targets/mediatek/filogic -maxdepth 1 \
            -name '*cmcc_rax3000m-emmc*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$image"
          test -x staging_dir/host/bin/fwtool
          staging_dir/host/bin/fwtool -i /tmp/metadata.json "$image"
          jq -e \
            '.supported_devices | index("cmcc,rax3000m-emmc") != null' \
            /tmp/metadata.json
          tar -tf "$image" | grep -E \
            'sysupgrade-cmcc_rax3000m-emmc/(CONTROL|kernel|root)$'
          test -n "$(find bin/packages -name 'ua3f-*.apk' -print -quit)"
          test -n "$(find bin/packages -name 'luci-app-openclash-*.apk' -print -quit)"
          sha256sum "$image" | tee "${image}.sha256"
          cp /tmp/metadata.json "${image}.metadata.json"
          cp .config bin/targets/mediatek/filogic/build.config

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-rax3000m-emmc-apk
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*cmcc_rax3000m-emmc*squashfs-sysupgrade.bin
            immortalwrt/bin/targets/mediatek/filogic/*cmcc_rax3000m-emmc*squashfs-sysupgrade.bin.sha256
            immortalwrt/bin/targets/mediatek/filogic/*cmcc_rax3000m-emmc*squashfs-sysupgrade.bin.metadata.json
            immortalwrt/bin/targets/mediatek/filogic/build.config
            immortalwrt/bin/packages/**/ua3f-*.apk
            immortalwrt/bin/packages/**/luci-app-openclash-*.apk
          if-no-files-found: error
          retention-days: 14

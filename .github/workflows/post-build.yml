name: Post-build verification

on:
  workflow_run:
    workflows:
      - Build ImmortalWrt RAX3000M eMMC
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-and-notify:
    runs-on: ubuntu-24.04

    steps:
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Download firmware artifact
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p firmware
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name immortalwrt-25.12.2-rax3000m-emmc-apk \
            --dir firmware

      - name: Verify firmware
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          image="$(find firmware -type f \
            -name '*cmcc_rax3000m-emmc*squashfs-sysupgrade.bin' \
            -print -quit)"
          test -n "$image"
          test -f "${image}.sha256"
          test -f "${image}.metadata.json"
          expected_sha="$(cut -d' ' -f1 "${image}.sha256")"
          actual_sha="$(sha256sum "$image" | cut -d' ' -f1)"
          test "$actual_sha" = "$expected_sha"
          jq -e \
            '.supported_devices | index("cmcc,rax3000m-emmc") != null' \
            "${image}.metadata.json"
          tar -tf "$image" | grep -q \
            'sysupgrade-cmcc_rax3000m-emmc/kernel'
          tar -tf "$image" | grep -q \
            'sysupgrade-cmcc_rax3000m-emmc/root'
          workdir="$(mktemp -d)"
          tar -xf "$image" -C "$workdir"
          root_image="$(find "$workdir" -path '*/root' -print -quit)"
          sudo unsquashfs -d "$workdir/rootfs" "$root_image" >/dev/null
          test -x "$workdir/rootfs/usr/bin/apk"
          test -x "$workdir/rootfs/usr/bin/ua3f"
          test -x "$workdir/rootfs/etc/init.d/openclash"
          build_config="$(find firmware -name build.config -print -quit)"
          test -n "$build_config"
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y$' "$build_config"
          test -x \
            "$workdir/rootfs/etc/uci-defaults/99-rax3000m-emmc-network"
          grep -q "network.lan.ipaddr='10.0.0.1'" \
            "$workdir/rootfs/etc/uci-defaults/99-rax3000m-emmc-network"
          PLATFORM_SH="$workdir/rootfs/lib/upgrade/platform.sh" python3 - <<'PY'
          import os
          from pathlib import Path

          text = Path(os.environ["PLATFORM_SH"]).read_text()
          upgrade = text.split("platform_do_upgrade()", 1)[1]
          upgrade = upgrade.split("platform_check_image()", 1)[0]
          marker = "cmcc,rax3000m-emmc|\\"
          pos = upgrade.index(marker)
          branch = upgrade[pos:pos + 800]
          required = (
              'CI_KERNPART="kernel"',
              'CI_ROOTPART="rootfs"',
              'CI_METHOD="emmc"',
              'emmc_do_upgrade "$1"',
          )
          if not all(item in branch for item in required):
              raise SystemExit("legacy eMMC upgrade branch is incomplete")

          check = text.split("platform_check_image()", 1)[1]
          pos = check.index(marker)
          branch = check[pos:pos + 500]
          if 'magic="$(dd if="$1" bs=1 skip=257 count=5' not in branch:
              raise SystemExit("sysupgrade tar validation branch is missing")
          PY
          {
            echo "IMAGE_NAME=$(basename "$image")"
            echo "IMAGE_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

      - name: Write verification report
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          {
            echo "# Firmware verification passed"
            echo
            echo "- Image: \`$IMAGE_NAME\`"
            echo "- SHA-256: \`$IMAGE_SHA256\`"
            echo "- Device: \`cmcc,rax3000m-emmc\`"
            echo "- Archive contains separate \`kernel\` and \`root\` entries."
            echo "- Source run: ${{ github.event.workflow_run.html_url }}"
            echo
            echo "Do not flash automatically. Review the result and recovery plan first."
          } | tee verification-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification report
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.event.workflow_run.id }}
          path: verification-report.md
          retention-days: 14
